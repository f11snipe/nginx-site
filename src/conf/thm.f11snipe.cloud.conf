server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name thm.f11snipe.cloud;

  ssl_certificate     /etc/dehydrated/certs/thm.f11snipe.cloud/fullchain.pem;
  ssl_certificate_key /etc/dehydrated/certs/thm.f11snipe.cloud/privkey.pem;
  ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  # ssl_certificate     /etc/ssl/cloudflare/thm.f11snipe.cloud.crt;
  # ssl_certificate_key /etc/ssl/cloudflare/thm.f11snipe.cloud.key;
  # ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
  # ssl_ciphers         HIGH:!aNULL:!MD5;
  # ssl_client_certificate /etc/ssl/cloudflare/client.crt;
  # ssl_verify_client on;

  root /var/www/thm.f11snipe.cloud;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
