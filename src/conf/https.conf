server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name _;

  # ssl_certificate     /etc/dehydrated/certs/f11snipe.sh/fullchain.pem;
  # ssl_certificate_key /etc/dehydrated/certs/f11snipe.sh/privkey.pem;
  # ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
  # ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_certificate     /etc/ssl/cloudflare/f11snipe.sh.crt;
  ssl_certificate_key /etc/ssl/cloudflare/f11snipe.sh.key;
  ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_client_certificate /etc/ssl/cloudflare/client.crt;
  ssl_verify_client on;

  return 302 https://f11snipe.live?src=derplol;
}
