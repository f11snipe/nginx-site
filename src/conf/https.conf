server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name _;

  ssl_certificate     /etc/dehydrated/certs/f11snipe.sh/fullchain.pem;
  ssl_certificate_key /etc/dehydrated/certs/f11snipe.sh/privkey.pem;
  ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  return 302 https://f11snipe.live?src=derplol;
}


server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name koth.rest;

  ssl_certificate     /etc/dehydrated/certs/koth.rest/fullchain.pem;
  ssl_certificate_key /etc/dehydrated/certs/koth.rest/privkey.pem;
  ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-NginX-Proxy true;
    proxy_pass http://localhost:8000/;
    proxy_redirect http://localhost:8000/ https://$server_name/;
  }
}